# Nginx sirve los archivos estáticos y pasa los .php a PHP-FPM (contenedor "wordpress")
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Tamaño máximo de subida (temas, plugins, imágenes)
    client_max_body_size 64M;

    # Enlaces permanentes de WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Caché de archivos estáticos
    location ~* \.(css|js|png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Bloquea archivos ocultos (.htaccess, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
