<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sysadmin@log: ~</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Convertidor de Markdown a HTML (ultra ligero) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <header>
    <div class="terminal-prompt">miguelguzman@Oaxaqueando:<span>~#</span> ./blog.sh --list</div>
    <h1>SysOps & Linux Infra Log</h1>
    <p>Bitácora técnica sobre Linux, automatización, SRE y redes.</p>
    <nav>
      <a href="./">[ ~/posts ]</a>
      <a href="?page=about">[ ~/about ]</a>
    </nav>
  </header>

  <main id="content">
    <!-- Contenido inyectado dinámicamente -->
  </main>

  <!-- Elementos HTML donde se mostrarán los contadores -->
  <div class="view-counter">
    <span>👁️ Visitas a esta página: <strong id="page-views">--</strong></span>
    <span>🌐 Visitas totales: <strong id="total-views">--</strong></span>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
      // Extraer la ruta actual (ej: /posts/mi-post -> mi-post)
      const pathname = window.location.pathname.replace(/^\/|\/$/g, '');
      const currentPage = pathname || 'home';

      // Llamar al endpoint PHP enviando el nombre de la página
      fetch(`/api/tracker.php?page=${encodeURIComponent(currentPage)}`)
          .then(response => response.json())
          .then(data => {
              if (data.status === 'success') {
                  const totalEl = document.getElementById('total-views');
                  const pageEl = document.getElementById('page-views');

                  if (totalEl) totalEl.textContent = data.total_views.toLocaleString();
                  if (pageEl) pageEl.textContent = data.page_views.toLocaleString();
              }
          })
          .catch(err => console.error("Error al registrar visita:", err));
  });
  </script>

  <script src="app.js"></script>
</body>
</html>
